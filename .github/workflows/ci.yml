name: Run Tests and Deploy

on:
  push:
    branches:
      - dev  
  pull_request:
    branches:
      - dev  

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'


      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test

      - name: Deploy to Netlify
        if: github.ref == 'refs/heads/dev'  
        uses: netlify/actions/cli@v3
        with:
          command: 'netlify deploy'
          directory: './dist' 
          site_id: ${{ secrets.9b48e542-9148-404f-8dd0-4efd6b186e6e }} 
          auth_token: ${{ secrets.nfp_AP8fCnNAFRoXAGYSSAWQNKtJtHe6w92850bc}}  
